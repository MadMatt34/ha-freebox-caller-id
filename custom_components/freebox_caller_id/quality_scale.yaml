
rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands:
    status: exempt
    comment: >-
      Since Home Assistant 2026.3 the integration's logo and icon are not required in the official Home Assistant brands repository.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: This integration does not provide conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not provide Home Assistant triggers.
  entity-event-setup:
    status: exempt
    comment: >-
      Entities do not subscribe directly to events; incoming-call detection
      and event firing are handled by the coordinator.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: >-
      The integration does not support discovery; the user must provide the
      Freebox address.
  discovery:
    status: exempt
    comment: >-
      The integration does not support discovery; the user must provide the
      Freebox address.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: >-
      The integration does not currently support dynamic device creation; all
      devices must be manually added by the user.
  entity-category:
    status: todo
    comment: >-
      Add entity categories to all entities, where appropriate, to help users
      understand the purpose of each entity and how it relates to the overall
      integration.
  entity-device-class: done
  entity-disabled-by-default:
    status: todo
    comment: >-
      Review all entities and determine if any should be disabled by default
      to reduce clutter in the user's entity list.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: todo
    comment: >-
      Le flux d’options permet de modifier les intervalles, mais pas de reconfigurer l’adresse de la Freebox.
 repair-issues:
    status: todo
    comment: >-
      La réauthentification existe, mais pas de mécanisme de réparations
      dédié. Il faut vérifier si un cas nécessite une action
      manuelle de l’utilisateur et, si oui, proposer une réparation.
  stale-devices:
    status: todo
    comment: >-
      exempt, à justifier : L’intégration ne gère pas une collection de périphériques susceptibles de disparaître individuellement ; elle représente une Freebox par entrée.

  # Platinum
  async-dependency:
    status: todo
    comment: >-
      exempt, à justifier : L’intégration appelle directement l’API Freebox avec aiohttp de manière asynchrone ; elle ne semble pas utiliser de bibliothèque externe bloquante pour les échanges réseau. phonenumberslite sert au traitement des numéros, pas aux E/S.
  inject-websession: done
  strict-typing:
    status: todo
    comment: >-
      Le code comporte de nombreuses annotations, mais cela ne suffit pas à démontrer le typage strict : aucune configuration ou exécution de vérification stricte de type n’a été identifiée. diagnostics.py utilise notamment Any, et plusieurs réponses API sont converties avec cast.
